upstream examdump_api {
    server api:4000;
    keepalive 32;
}

upstream examdump_web {
    server web:3000;
    keepalive 32;
}

# Rate limiting at the edge (defence in depth; the API also enforces limits).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

# ---------------------------------------------------------------------------
# HTTP: ACME challenges + permanent redirect to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: TLS termination and reverse proxy for the API + web app.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/examtopicspro.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examtopicspro.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    # Never gzip event streams: buffering for compression delays and can cut SSE.
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_proxied off;
    gzip_min_length 1024;

    # Let's Encrypt renewals keep working over TLS too.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Payment gateway webhooks must not be rate limited or buffered oddly.
    location /api/payments/webhook/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://examdump_api;
    }

    # AI tutor chat streams Server-Sent Events. Buffering would hold tokens
    # until the whole answer finished, so this location disables it and gets a
    # longer read timeout than the regular API.
    location /api/ai/chat/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
        proxy_pass http://examdump_api;
    }

    # API
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass http://examdump_api;
    }

    # Web app (Next.js)
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_pass http://examdump_web;
    }
}
