upstream examdump_api {
    server api:4000;
    keepalive 32;
}

upstream examdump_web {
    server web:3000;
    keepalive 32;
}

# Rate limiting at the edge (defence in depth; the API also enforces limits).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge (safe to keep even before SSL is enabled)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # API
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass http://examdump_api;
    }

    # Web app (Next.js)
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_pass http://examdump_web;
    }
}