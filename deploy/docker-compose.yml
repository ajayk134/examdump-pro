# Production stack for the Oracle Cloud VM.
#
# Secrets are never written here. Run compose under Doppler so ${VARS} are
# injected from the environment:
#
#   cd deploy
#   doppler run --project examdump-pro --config prd -- docker compose up -d --build
#
# (Or use the existing agent-keys/dev_personal project for a staging box.)
name: examdump-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examdump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-examdump}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-examdump} -d ${POSTGRES_DB:-examdump}']
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - '5432'
    networks:
      - examdump
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      # Must be provided explicitly (nested defaults are not portable across
      # compose implementations). Format: postgres://user:pass@host:5432/db
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-ExamDump Pro <no-reply@examdump.pro>}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DATASET_OWNER: ${DATASET_OWNER:-ajayk134}
      DATASET_REPO: ${DATASET_REPO:-exam-data}
      DATASET_BRANCH: ${DATASET_BRANCH:-main}
      ENABLE_DATASET_SYNC: "true"
      DATASET_SYNC_CRON: ${DATASET_SYNC_CRON:-0 3 * * *}
      # --- AI (NVIDIA NIM) -------------------------------------------------
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-700}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_WEB_SEARCH: ${AI_WEB_SEARCH:-false}
      AI_DAILY_LIMIT_FREE: ${AI_DAILY_LIMIT_FREE:-10}
      AI_DAILY_LIMIT_PREMIUM: ${AI_DAILY_LIMIT_PREMIUM:-200}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # --- Payments ---------------------------------------------------------
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_RECONCILE_CRON: ${PAYMENT_RECONCILE_CRON:-*/15 * * * *}
      HYPERSWITCH_BASE_URL: ${HYPERSWITCH_BASE_URL:-}
      HYPERSWITCH_API_KEY: ${HYPERSWITCH_API_KEY:-}
      HYPERSWITCH_ADMIN_API_KEY: ${HYPERSWITCH_ADMIN_API_KEY:-}
      HYPERSWITCH_MERCHANT_ID: ${HYPERSWITCH_MERCHANT_ID:-}
      HYPERSWITCH_PROFILE_ID: ${HYPERSWITCH_PROFILE_ID:-}
      HYPERSWITCH_WEBHOOK_SECRET: ${HYPERSWITCH_WEBHOOK_SECRET:-}
      HYPERSWITCH_API_VERSION: ${HYPERSWITCH_API_VERSION:-2022-09-01}
      HYPERSWITCH_CONNECTORS: ${HYPERSWITCH_CONNECTORS:-stripe}
      HYPERSWITCH_HTTP_TIMEOUT_MS: ${HYPERSWITCH_HTTP_TIMEOUT_MS:-20000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    expose:
      - '4000'
    networks:
      - examdump
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ''
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    networks:
      - examdump
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - examdump
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  examdump:
    driver: bridge

volumes:
  pgdata: